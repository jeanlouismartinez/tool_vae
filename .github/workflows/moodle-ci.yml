# Intégration continue officielle de Moodle (moodle-plugin-ci), sur GitHub.
#
# Version du dépôt public (tool_vae) : la tâche « migration » du projet d'origine, qui installe Moodle 4.5 avec
# la branche MOODLE_405 de ce projet, n'y figure pas ; elle reste dans le dépôt de travail.
#
# Réécrit le 11 octobre 2026 : le fichier annoncé au CHANGELOG 0.6.2 n'avait jamais été commité.
# Branche MOODLE_503 : une seule version de Moodle dans la matrice, parce que version.php déclare
# supported = [503, 503] ; la tâche « migration » prouve en plus le passage du paquet 4.5 au paquet 5.3.
# Annoncer une compatibilité qu'on ne teste pas serait pire que ne rien annoncer.
# Deux bases, parce que tout n'a été vérifié jusqu'ici que sur PostgreSQL.

name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        moodle-branch: ['MOODLE_503_STABLE']
        database: [pgsql, mariadb]

    steps:
      - name: Récupérer le plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Contrôles propres au projet (MC-2, MC-5, RGPD, langue, secrets)
        working-directory: plugin
        run: |
          bash scripts/mc2-ecriture-coeur.sh .
          bash scripts/mc5-passerelle.sh .
          php scripts/verifier-privacy.php .
          php scripts/verifier-langue.php .
          bash scripts/verifier-secrets.sh .

      - name: Schéma pivot reconstruit (exemples et contre-exemples)
        working-directory: plugin
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/ajv" ajv@8.17.1 ajv-formats@3.0.1
          AJV_MODULES="$RUNNER_TEMP/ajv/node_modules" node scripts/verifier-schema.mjs .

      - name: Installer moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Installer Moodle et le plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Syntaxe PHP
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Standard de codage Moodle
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHPDoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validation du plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Points de sauvegarde des mises à jour
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Gabarits Mustache
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ !cancelled() }}
        env:
          TOOL_VAE_SCHEMA_DUMP: ${{ runner.temp }}/preuves-exportees
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Preuves exportées par les tests, validées contre le schéma
        if: ${{ !cancelled() }}
        working-directory: plugin
        run: |
          AJV_MODULES="$RUNNER_TEMP/ajv/node_modules" node scripts/verifier-schema.mjs . --preuves "$RUNNER_TEMP/preuves-exportees"

      - name: Behat (dont le scénario @javascript et axe-core)
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Captures en cas d'échec Behat
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore
